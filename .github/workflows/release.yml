name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the manifest version
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} must exactly match manifest.json version ${MANIFEST_VERSION} (no leading v)" >&2
            exit 1
          fi
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "package.json version ${PKG_VERSION} must match manifest.json version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Build project
        run: npm run build

      # Obsidian installs a plugin from these three files, so refuse to publish a
      # release that would be missing one of them.
      - name: Verify release assets exist
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --draft=false --prerelease=false --latest
            gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG" \
              --latest \
              main.js manifest.json styles.css
          fi

      # Runs last and never gates publishing: a Sigstore/OIDC hiccup must not be able to
      # leave a tagged release with no assets attached, which is what Obsidian's reviewer
      # reported for 1.0.1.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
